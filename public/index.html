<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Received | Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-screen font-sans">
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="font-bold text-lg text-white">JSON Received</h1>
    </div>
    <div class="flex items-center space-x-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-sm">
      <span class="text-gray-400">Endpoint:</span>
      <code id="endpointUrl" class="text-emerald-400 font-mono select-all">Loading...</code>
      <button onclick="copyEndpoint()" class="ml-2 px-2 py-0.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-gray-200">Copy</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <div class="w-1/3 border-r border-gray-800 flex flex-col">
      <div class="p-3 border-b border-gray-800 text-xs font-semibold uppercase tracking-wider text-gray-400 flex justify-between">
        <span>Incoming Requests</span>
        <span id="reqCount">0 items</span>
      </div>
      <div id="requestList" class="flex-1 overflow-y-auto divide-y divide-gray-800"></div>
    </div>

    <div class="w-2/3 flex flex-col bg-gray-900 overflow-y-auto p-6">
      <div id="emptyState" class="m-auto text-center text-gray-500">
        <p class="text-base font-medium">Waiting for incoming JSON...</p>
        <p class="text-xs mt-2 text-gray-600">Send a POST request using the endpoint at the top.</p>
      </div>

      <div id="payloadView" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold uppercase text-gray-400">Payload (JSON Body)</h2>
          <button onclick="copyJson()" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-xs text-gray-200">Copy JSON</button>
        </div>
        <pre id="jsonDisplay" class="bg-gray-950 p-4 rounded-lg font-mono text-xs text-emerald-300 overflow-x-auto border border-gray-800"></pre>

        <h2 class="text-sm font-semibold uppercase text-gray-400 pt-4">Headers</h2>
        <pre id="headerDisplay" class="bg-gray-950 p-4 rounded-lg font-mono text-xs text-gray-300 overflow-x-auto border border-gray-800"></pre>
      </div>
    </div>
  </div>

  <script>
    const binId = window.location.pathname.split('/').filter(Boolean)[1];
    const endpoint = `${window.location.origin}/api/catch/${binId}`;
    document.getElementById('endpointUrl').innerText = endpoint;

    let records = [];
    let selectedRecord = null;

    function copyEndpoint() {
      navigator.clipboard.writeText(endpoint);
      alert('Endpoint copied to clipboard!');
    }

    function copyJson() {
      if (selectedRecord) {
        navigator.clipboard.writeText(JSON.stringify(selectedRecord.body, null, 2));
      }
    }

    function renderList() {
      const list = document.getElementById('requestList');
      const count = document.getElementById('reqCount');
      list.innerHTML = '';
      count.innerText = `${records.length} items`;

      records.forEach((item) => {
        const div = document.createElement('div');
        div.className = `p-4 cursor-pointer hover:bg-gray-900 transition flex items-center justify-between ${selectedRecord?.id === item.id ? 'bg-gray-900 border-l-4 border-emerald-500' : ''}`;
        div.onclick = () => selectRecord(item);

        div.innerHTML = `
          <div>
            <span class="text-xs font-bold px-1.5 py-0.5 rounded ${item.method === 'POST' ? 'bg-blue-900 text-blue-200' : 'bg-amber-900 text-amber-200'}">${item.method}</span>
            <span class="text-xs text-gray-400 ml-2">${item.timestamp}</span>
          </div>
          <span class="text-xs font-mono text-gray-500">#${item.id.slice(0, 6)}</span>
        `;
        list.appendChild(div);
      });
    }

    function selectRecord(record) {
      selectedRecord = record;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('payloadView').classList.remove('hidden');

      document.getElementById('jsonDisplay').innerText = JSON.stringify(record.body, null, 2);
      document.getElementById('headerDisplay').innerText = JSON.stringify(record.headers, null, 2);
      renderList();
    }

    const eventSource = new EventSource(`/api/stream/${binId}`);

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'INIT') {
        records = data.history || [];
        if (records.length > 0) selectRecord(records[0]);
      } else {
        records.unshift(data);
        selectRecord(data);
      }
      renderList();
    };
  </script>
</body>
            </html>
