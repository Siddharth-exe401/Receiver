<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER_RECEIVER // INGRESS_TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon: #00ff66;
      --neon-dim: #008f39;
      --neon-glow: rgba(0, 255, 102, 0.35);
      --dark-bg: #050a06;
    }
    body {
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
      background-color: var(--dark-bg);
      color: #00ff66;
    }
    /* CRT Scanline & grid aesthetic */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    .neon-border {
      border: 1px solid var(--neon-dim);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.15), inset 0 0 10px rgba(0, 255, 102, 0.05);
    }
    .neon-border-active {
      border: 1px solid var(--neon);
      box-shadow: 0 0 15px var(--neon-glow);
    }
    .neon-text-glow {
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
    }
    /* Custom Green Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020703;
    }
    ::-webkit-scrollbar-thumb {
      background: #008f39;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ff66;
    }
    .blink {
      animation: blinker 1s linear infinite;
    }
    @keyframes blinker {
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none overflow-hidden relative">

  <!-- Scanlines overlay -->
  <div class="scanlines fixed inset-0 z-50 pointer-events-none"></div>

  <!-- Terminal Top Bar -->
  <header class="neon-border bg-black/80 px-6 py-3 flex items-center justify-between z-10 m-2 mb-0">
    <div class="flex items-center space-x-3">
      <div class="h-2.5 w-2.5 rounded-full bg-[#00ff66] shadow-[0_0_10px_#00ff66] animate-pulse"></div>
      <div class="tracking-widest font-bold text-sm neon-text-glow flex items-center gap-1">
        <span>[SYS.NET_RECEIVER]</span>
        <span class="text-xs text-[#008f39]">// PORT_LISTENER_ACTIVE</span>
      </div>
    </div>
    <div class="flex items-center space-x-2 bg-black/60 border border-[#008f39] px-3 py-1 rounded text-xs">
      <span class="text-[#008f39]">ENDPOINT:</span>
      <code id="endpointUrl" class="text-[#00ff66] select-all font-mono font-bold"></code>
      <button onclick="copyEndpoint()" class="ml-2 px-2 py-0.5 bg-[#002b11] hover:bg-[#00ff66] hover:text-black border border-[#00ff66] text-[#00ff66] text-xs transition duration-150">
        [COPY]
      </button>
    </div>
  </header>

  <!-- Main Body Grid -->
  <div class="flex flex-1 overflow-hidden m-2 gap-2 z-10">
    
    <!-- Left: Intercepted Packet Log -->
    <div class="w-1/3 neon-border bg-black/70 flex flex-col">
      <div class="p-3 border-b border-[#008f39] text-xs tracking-wider uppercase text-[#008f39] flex justify-between items-center bg-[#00170a]">
        <span class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 bg-[#00ff66]"></span>
          INCOMING_STREAM
        </span>
        <span id="reqCount" class="text-[#00ff66] font-bold">[00 PKTS]</span>
      </div>
      <div id="requestList" class="flex-1 overflow-y-auto divide-y divide-[#002b11]">
        <!-- Logs appear here -->
      </div>
    </div>

    <!-- Right: Decrypted Packet Data -->
    <div class="w-2/3 neon-border bg-black/70 flex flex-col overflow-hidden">
      
      <!-- Empty state -->
      <div id="emptyState" class="m-auto text-center p-8">
        <div class="text-2xl neon-text-glow mb-2 animate-pulse">&gt; LISTENING ON SOCKET...<span class="blink">_</span></div>
        <p class="text-xs text-[#008f39] tracking-wider">AWAITING INBOUND JSON INJECTION VIA HTTP POST</p>
      </div>

      <!-- Payload Content -->
      <div id="payloadView" class="hidden flex-1 flex flex-col p-4 overflow-y-auto space-y-4">
        
        <div class="flex items-center justify-between border-b border-[#008f39] pb-2">
          <span class="text-xs tracking-widest text-[#008f39] font-bold uppercase">&gt; RAW_JSON_PAYLOAD</span>
          <button onclick="copyJson()" class="px-2.5 py-1 bg-[#002b11] hover:bg-[#00ff66] hover:text-black border border-[#00ff66] text-xs transition duration-150">
            [COPY_PAYLOAD]
          </button>
        </div>
        <pre id="jsonDisplay" class="bg-[#020d05] p-4 rounded border border-[#003816] font-mono text-xs text-[#00ff66] overflow-x-auto shadow-inner"></pre>

        <div class="border-b border-[#008f39] pb-2 pt-2">
          <span class="text-xs tracking-widest text-[#008f39] font-bold uppercase">&gt; PACKET_HEADERS</span>
        </div>
        <pre id="headerDisplay" class="bg-[#020d05] p-4 rounded border border-[#003816] font-mono text-xs text-[#00aa44] overflow-x-auto shadow-inner"></pre>
      </div>
    </div>
  </div>

  <script>
    const endpoint = window.location.origin + '/';
    document.getElementById('endpointUrl').innerText = endpoint;

    let records = [];
    let selectedRecord = null;

    function copyEndpoint() {
      navigator.clipboard.writeText(endpoint);
      alert('TARGET_URL_COPIED');
    }

    function copyJson() {
      if (selectedRecord) {
        navigator.clipboard.writeText(JSON.stringify(selectedRecord.body, null, 2));
        alert('PAYLOAD_COPIED');
      }
    }

    function renderList() {
      const list = document.getElementById('requestList');
      document.getElementById('reqCount').innerText = `[${String(records.length).padStart(2, '0')} PKTS]`;
      list.innerHTML = '';

      records.forEach((item) => {
        const div = document.createElement('div');
        const isSelected = selectedRecord?.id === item.id;
        div.className = `p-3 cursor-pointer transition flex items-center justify-between border-l-2 ${isSelected ? 'bg-[#00260f] border-[#00ff66] neon-text-glow' : 'border-transparent hover:bg-[#00170a]'}`;
        div.onclick = () => selectRecord(item);

        div.innerHTML = `
          <div>
            <span class="text-[10px] bg-[#00ff66] text-black px-1.5 py-0.5 font-bold uppercase">POST</span>
            <span class="text-xs text-[#00ff66] ml-2 tracking-wider">${item.timestamp}</span>
          </div>
          <span class="text-[10px] text-[#008f39] font-mono tracking-widest">UID:${item.id}</span>
        `;
        list.appendChild(div);
      });
    }

    function selectRecord(record) {
      selectedRecord = record;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('payloadView').classList.remove('hidden');

      document.getElementById('jsonDisplay').innerText = JSON.stringify(record.body, null, 2);
      document.getElementById('headerDisplay').innerText = JSON.stringify(record.headers, null, 2);
      renderList();
    }

    const eventSource = new EventSource('/events');
    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'INIT') {
        records = data.history || [];
        if (records.length > 0) selectRecord(records[0]);
      } else {
        records.unshift(data);
        selectRecord(data);
      }
      renderList();
    };
  </script>
</body>
</html>
