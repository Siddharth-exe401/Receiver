<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RECEIVER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon: #00ff66;
      --neon-dim: #008f39;
      --neon-glow: rgba(0, 255, 102, 0.35);
      --dark-bg: #050a06;
    }
    body {
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
      background-color: var(--dark-bg);
      color: #00ff66;
      -webkit-tap-highlight-color: transparent;
    }
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    .neon-border {
      border: 1px solid var(--neon-dim);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.15), inset 0 0 10px rgba(0, 255, 102, 0.05);
    }
    .neon-text-glow {
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #020703;
    }
    ::-webkit-scrollbar-thumb {
      background: #008f39;
      border-radius: 2px;
    }
    .blink {
      animation: blinker 1s linear infinite;
    }
    @keyframes blinker {
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none overflow-hidden relative p-2 gap-2">

  <!-- Scanlines overlay -->
  <div class="scanlines fixed inset-0 z-50 pointer-events-none"></div>

  <!-- Header -->
  <header class="neon-border bg-black/80 px-4 py-2.5 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center space-x-2.5">
      <div class="h-2.5 w-2.5 rounded-full bg-[#00ff66] shadow-[0_0_10px_#00ff66] animate-pulse"></div>
      <h1 class="tracking-widest font-bold text-base neon-text-glow">[RECEIVER]</h1>
    </div>
    <div id="connectionStatus" class="text-[11px] text-[#00ff66] tracking-wider uppercase bg-[#001f0c] px-2 py-0.5 border border-[#008f39] rounded">
      ONLINE
    </div>
  </header>

  <!-- Main Content Grid -->
  <div class="flex flex-col md:flex-row flex-1 overflow-hidden gap-2 z-10 min-h-0">
    
    <!-- Packet List: Height-limited on mobile, full height column on desktop -->
    <div class="h-44 md:h-full md:w-1/3 neon-border bg-black/70 flex flex-col shrink-0">
      <div class="p-2.5 border-b border-[#008f39] text-xs tracking-wider uppercase text-[#008f39] flex justify-between items-center bg-[#00170a]">
        <span class="flex items-center gap-1.5 font-bold">
          <span class="inline-block w-1.5 h-1.5 bg-[#00ff66]"></span>
          STREAM
        </span>
        <span id="reqCount" class="text-[#00ff66] font-bold">[00 PKTS]</span>
      </div>
      <div id="requestList" class="flex-1 overflow-y-auto divide-y divide-[#002b11]">
        <!-- Incoming logs render here -->
      </div>
    </div>

    <!-- Packet Details -->
    <div class="flex-1 neon-border bg-black/70 flex flex-col overflow-hidden min-h-0">
      
      <!-- Empty State -->
      <div id="emptyState" class="m-auto text-center p-6">
        <div class="text-lg md:text-xl neon-text-glow mb-1 animate-pulse">&gt; LISTENING...<span class="blink">_</span></div>
        <p class="text-[11px] text-[#008f39] tracking-wider">AWAITING INBOUND DATA</p>
      </div>

      <!-- Payload Content -->
      <div id="payloadView" class="hidden flex-1 flex flex-col p-3 md:p-4 overflow-y-auto space-y-3">
        
        <div class="flex items-center justify-between border-b border-[#008f39] pb-1.5">
          <span class="text-xs tracking-wider text-[#008f39] font-bold uppercase">&gt; PAYLOAD</span>
          <button onclick="copyJson()" class="px-2.5 py-1 bg-[#002b11] active:bg-[#00ff66] active:text-black hover:bg-[#00ff66] hover:text-black border border-[#00ff66] text-xs transition">
            [COPY]
          </button>
        </div>
        <pre id="jsonDisplay" class="bg-[#020d05] p-3 rounded border border-[#003816] font-mono text-xs text-[#00ff66] overflow-x-auto whitespace-pre-wrap break-all shadow-inner"></pre>

        <div class="border-b border-[#008f39] pb-1.5 pt-1">
          <span class="text-xs tracking-wider text-[#008f39] font-bold uppercase">&gt; HEADERS</span>
        </div>
        <pre id="headerDisplay" class="bg-[#020d05] p-3 rounded border border-[#003816] font-mono text-[11px] text-[#00aa44] overflow-x-auto whitespace-pre-wrap break-all shadow-inner"></pre>
      </div>

    </div>
  </div>

  <script>
    let records = [];
    let selectedRecord = null;

    function copyJson() {
      if (selectedRecord) {
        navigator.clipboard.writeText(JSON.stringify(selectedRecord.body, null, 2));
      }
    }

    function renderList() {
      const list = document.getElementById('requestList');
      document.getElementById('reqCount').innerText = `[${String(records.length).padStart(2, '0')} PKTS]`;
      list.innerHTML = '';

      records.forEach((item) => {
        const div = document.createElement('div');
        const isSelected = selectedRecord?.id === item.id;
        div.className = `p-2.5 cursor-pointer transition flex items-center justify-between border-l-2 ${isSelected ? 'bg-[#00260f] border-[#00ff66] neon-text-glow' : 'border-transparent hover:bg-[#00170a]'}`;
        div.onclick = () => selectRecord(item);

        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-[9px] bg-[#00ff66] text-black px-1 py-0.2 font-bold uppercase">POST</span>
            <span class="text-xs text-[#00ff66] tracking-wider">${item.timestamp}</span>
          </div>
          <span class="text-[10px] text-[#008f39] font-mono">#${item.id}</span>
        `;
        list.appendChild(div);
      });
    }

    function selectRecord(record) {
      selectedRecord = record;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('payloadView').classList.remove('hidden');

      document.getElementById('jsonDisplay').innerText = JSON.stringify(record.body, null, 2);
      document.getElementById('headerDisplay').innerText = JSON.stringify(record.headers, null, 2);
      renderList();
    }

    const eventSource = new EventSource('/events');

    eventSource.onopen = () => {
      document.getElementById('connectionStatus').innerText = 'ONLINE';
    };

    eventSource.onerror = () => {
      document.getElementById('connectionStatus').innerText = 'RECONNECTING';
    };

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'INIT') {
        records = data.history || [];
        if (records.length > 0) selectRecord(records[0]);
      } else {
        records.unshift(data);
        selectRecord(data);
      }
      renderList();
    };
  </script>
</body>
</html>
